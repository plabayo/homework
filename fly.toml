app = 'homework'
primary_region = 'fra'

[experimental]
auto_rollback = true

[processes]
app = "--http 0.0.0.0:8080 --https 0.0.0.0:8443 --h3 fly-global-services:443 --h3-mtu-upper-bound 1280"

[env]
RUST_LOG = 'info,homework=debug,rama_http=debug,rama_http_core=info'

[[services]]
protocol = "tcp"
internal_port = 8080
processes = ['app']

    [services.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 2000

    [[services.ports]]
    port = 80
    handlers = ["proxy_proto"]

    [[services.tcp_checks]]
    interval = "15s"
    timeout  = "5s"
    grace_period = "1s"
    restart_limit = 0

[[services]]
protocol = "tcp"
internal_port = 8443
processes = ['app']

    [services.concurrency]
    type = "connections"
    soft_limit = 1000
    hard_limit = 2000

    [[services.ports]]
    port = 443
    handlers = ["proxy_proto"]

    [[services.tcp_checks]]
    interval = "15s"
    timeout  = "5s"
    grace_period = "1500s"
    restart_limit = 0

# HTTP/3. UDP needs the app's dedicated IPv4 and keeps its port: the app binds
# 443 itself, on `fly-global-services` (resolved by the Dockerfile entrypoint)
# so Fly routes the replies. HTTPS responses advertise it with `Alt-Svc`.
[[services]]
protocol = "udp"
internal_port = 443
processes = ['app']

    [[services.ports]]
    port = 443

[[vm]]
  size = 'shared-cpu-1x'
